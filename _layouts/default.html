<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.permalink != "/" %}{{ page.title }} · {% endif %}{{ site.name }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script>
  // Apply a saved light/dark choice before the page paints.
  try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="name" href="{{ '/' | relative_url }}">{{ site.short_name }}</a>
    <ul>
      <li><a href="{{ '/#publications' | relative_url }}">Publications</a></li>
      {%- assign nav_pages = site.pages | where: "nav", true | sort: "nav_order" %}
      {%- for p in nav_pages %}
      <li><a href="{{ p.url | relative_url }}"{% if p.url == page.url %} aria-current="page"{% endif %}>{{ p.title }}</a></li>
      {%- endfor %}
      <li><button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button></li>
    </ul>
  </div>
</nav>

<main class="wrap">
{{ content }}
</main>

<footer>
  <div class="wrap">{{ site.name }} · {{ site.email | replace: "@", " [at] " | replace: ".", " [dot] " }}</div>
</footer>

<script>
  document.querySelector(".theme-toggle").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  });
</script>

</body>
</html>
